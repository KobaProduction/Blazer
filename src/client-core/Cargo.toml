[package]
name = "client-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "client_core.rs"

[dependencies]
vpn-application.workspace = true
vpn-infrastructure.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-http = { version = "=0.33.1", default-features = false, features = ["reqwest-blocking"] }
async-trait = "=0.1.92"

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { workspace = true, features = ["blocking", "native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { workspace = true, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"

[lints]
workspace = true
