[package]
name = "vpn-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
default-run = "vpn-client"

[features]
default = ["desktop"]
desktop = ["dep:vpn-backend"]
demo = []

[lib]
path = "desktop.rs"

[[bin]]
name = "vpn-client"
path = "main.rs"
required-features = ["desktop"]

[[bin]]
name = "vpn-client-demo"
path = "native/demo_main.rs"
required-features = ["demo"]

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
eframe = { workspace = true, features = ["experimental"] }
epaint_default_fonts = { version = "=0.37.0", features = ["monochrome_emoji_fonts"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde_json.workspace = true
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
vpn-backend = { workspace = true, optional = true }
vpn-presentation.workspace = true
vpn-image-import.workspace = true

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.17.2", default-features = false }
win-screenshot = "=4.0.14"
windows-registry = "=0.6.1"

[target.'cfg(windows)'.build-dependencies]
find-msvc-tools = "=0.1.15"

[lints]
workspace = true
