[package]
name = "blazer-macos"
build = "../apple/build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
packet-tunnel = ["dep:cc", "dep:nix"]

[build-dependencies]
cc = { version = "=1.11.1", optional = true }

[[bin]]
name = "blazer-macos"
path = "main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
client-core.workspace = true
client-ui.workspace = true
eframe = { workspace = true, features = ["clipboard", "default_fonts", "links", "system_fonts", "wgpu_no_default_features"] }
getrandom = "=0.4.3"
nix = { workspace = true, optional = true }
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
security-framework-sys = "=2.17.0"
vpn-application.workspace = true
vpn-infrastructure.workspace = true
vpn-presentation.workspace = true
wgpu = { version = "=30.0.1", default-features = false, features = ["metal", "std", "wgsl"] }
zeroize.workspace = true

[lints]
workspace = true
