[package]
name = "blazer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
default-run = "blazer"

[features]
demo = ["client-ui/demo"]

[lib]
path = "desktop.rs"

[[bin]]
name = "blazer"
path = "main.rs"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
client-ui.workspace = true
eframe = { workspace = true, features = ["clipboard", "default_fonts", "glow", "links", "system_fonts", "wayland", "x11"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
vpn-presentation.workspace = true

[target.'cfg(windows)'.dependencies]
client-cli.workspace = true
client-core.workspace = true
eframe = { workspace = true, features = ["persistence"] }
egui-winit = { version = "=0.37.0", default-features = false, features = ["serde"] }
reqwest = { workspace = true, features = ["blocking", "native-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "=3.27.0"
vpn-application.workspace = true
vpn-image-import.workspace = true
rfd = { version = "=0.17.2", default-features = false }
win-screenshot = "=4.0.14"
win32console = "=0.1.5"
windows-registry = "=0.6.1"
winit = { version = "=0.30.13", default-features = false }

[target.'cfg(windows)'.build-dependencies]
find-msvc-tools = "=0.1.15"

[lints]
workspace = true
