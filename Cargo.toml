[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure", "apps/desktop"]
default-members = ["apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
vpn-domain = { path = "crates/domain" }
vpn-application = { path = "crates/application" }
vpn-infrastructure = { path = "crates/infrastructure" }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "forbid"
