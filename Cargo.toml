[workspace]
members = [
    "src/domain",
    "src/application",
    "src/infrastructure",
    "src/client-core",
    "src/presentation/shared",
    "src/presentation/image_import",
    "src/presentation/client-ui",
    "src/presentation/client-cli",
    "src/platform/android",
    "src/platform/ios",
    "src/platform/linux",
    "src/platform/macos",
    "src/platform/windows",
]
default-members = ["src/platform/windows"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

[workspace.dependencies]
vpn-domain = { path = "src/domain" }
vpn-application = { path = "src/application" }
vpn-infrastructure = { path = "src/infrastructure" }
client-core = { path = "src/client-core" }
vpn-presentation = { path = "src/presentation/shared" }
vpn-image-import = { path = "src/presentation/image_import" }
client-ui = { path = "src/presentation/client-ui" }
client-cli = { path = "src/presentation/client-cli" }
opentelemetry = { version = "=0.33.1", default-features = false, features = ["logs", "metrics", "trace"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["logs", "metrics", "trace"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "logs", "reqwest-blocking-client"] }
eframe = { version = "=0.37.0", default-features = false }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts", "experimental"] }
jni = "=0.22.4"

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.8"
base64 = "=0.23.1"
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["gzip"] }
uuid = { version = "=1.29.2", features = ["v4"] }
zeroize = "=1.8.2"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["rt", "time", "net", "macros"] }
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "forbid"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.dev.package.sha2]
opt-level = 3
