name: Blazer releases

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blazer-release-${{ github.ref_type == 'tag' && github.ref_name || 'preview' }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install project toolchain
        shell: pwsh
        run: rustup toolchain install 1.95.0-x86_64-pc-windows-msvc --profile minimal --component rustfmt,clippy
      - name: Build Windows package
        shell: pwsh
        env:
          BLAZER_WINDOWS_ENGINE_ARCHIVE_URL: ${{ vars.BLAZER_WINDOWS_ENGINE_ARCHIVE_URL }}
        run: ./scripts/release-github.ps1 -Stage Build
      - name: Publish package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-github.ps1 -Stage Publish
